name: Android APK Build (Nanalab QR)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # GitHub 웹사이트의 [Actions] 탭에서 수동으로도 즉시 빌드 실행 가능
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Fullscreen WebView APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle 8.9 환경 설정 (안드로이드 스튜디오/래퍼 없이 빌드 지원)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 4. Debug & Release APK 빌드
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 5. Debug APK 아티팩트 업로드 (스마트폰 바로 설치용)
        uses: actions/upload-artifact@v4
        with:
          name: NanalabQR-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 6. Release APK 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: NanalabQR-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

